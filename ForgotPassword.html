<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#11141A" />
    <title>V-Rent | Forgot Password</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="ForgotPassword.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome (matches other auth pages) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Mobile-First Universal Overrides -->
    <style>
        /* Universal mobile resets */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* Prevent iOS auto-zoom on form focus */
        input,
        select,
        textarea,
        button {
            font-size: 16px;
            touch-action: manipulation;
        }

        /* Touch-friendly targets */
        .back-btn,
        .btn-submit {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* iPhone safe-area support */
        @supports (padding: env(safe-area-inset-bottom)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
            .reset-card {
                padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            }
        }

        /* Small phone tweaks */
        @media (max-width: 380px) {
            .reset-card {
                padding: 1.4rem 1.1rem;
                border-radius: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Background slideshow -->
    <div class="bg-container">
        <div class="bg-slide" style="background-image: url('bikes.png');"></div>
        <div class="bg-slide" style="background-image: url('supercar.png');"></div>
        <div class="bg-slide" style="background-image: url('pickup.png');"></div>
        <div class="bg-slide" style="background-image: url('mechinery.png');"></div>
        <div class="bg-slide" style="background-image: url('excavator.png');"></div>
    </div>
    <div class="bg-overlay"></div>

    <!-- Reset card -->
    <div class="reset-card">

        <!-- Brand + back button -->
        <div class="brand">
            <div class="brand-left">
                <img src="vrent-logo.jpeg" alt="V-Rent Logo" />
            </div>
            <a href="LogIn.html" class="back-btn" id="backBtn" aria-label="Go back">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                <span>Back</span>
            </a>
        </div>

        <div class="form-title">Forgot Password</div>

        <!-- Info text -->
        <div class="reset-info">
            Enter your email address and we'll send you a link to reset your password.
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="resetEmail" placeholder="blank@mail.com" required />
            </div>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Firebase Configuration -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvE1_9PpviXzJZJZ0Z6GnAcDJ5AFljAcE",
            authDomain: "v-rent-9048c.firebaseapp.com",
            projectId: "v-rent-9048c",
            storageBucket: "v-rent-9048c.firebasestorage.app",
            messagingSenderId: "1005234060424",
            appId: "1:1005234060424:web:34d0207a3589a70ff7333d",
            measurementId: "G-P827PD43LS"
        };

        firebase.initializeApp(firebaseConfig);
        window.auth = firebase.auth();
    </script>

    <!-- Page JavaScript -->
    <script src="ForgotPassword.js"></script>

    <!-- Smart back button (browser history when available) -->
    <script>
        (function () {
            const backBtn = document.getElementById('backBtn');
            if (!backBtn) return;

            backBtn.addEventListener('click', function (e) {
                if (window.history.length > 1) {
                    e.preventDefault();
                    window.history.back();
                }
                // else: default <a href="LogIn.html">
            });
        })();
    </script>
</body>
</html>
