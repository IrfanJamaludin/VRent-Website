<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Users</title>
    <link rel="stylesheet" href="AdminPanel.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="WhatsApp Image 2026-08-12 at 18.52.58.jpeg" alt="V-Rent Logo" class="sidebar-logo" />
            <span>V-Rent Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin-dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="admin-vehicles.html"><i class="fas fa-car"></i> Vehicles</a>
            <a href="admin-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
            <a href="admin-users.html" class="active"><i class="fas fa-users"></i> Users</a>
            <a href="admin-verifications.html"><i class="fas fa-id-card"></i> Verifications</a>
            <a href="admin-reviews.html" class="active"><i class="fas fa-star"></i> Reviews</a>
        </nav>
        <div class="sidebar-footer">
            <button id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-left">
                <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <h1>Users</h1>
            </div>
        </header>
        <div class="admin-content">

            <div class="section-toolbar">
                <h2><i class="fas fa-users"></i> Registered Users</h2>
            </div>

            <div class="table-container">
                <div id="usersList">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><p>Loading users...</p></div>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== MODALS ===== -->

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal modal-lg modal-futuristic">
            <div class="modal-header-futuristic">
                <div class="modal-header-content">
                    <span class="modal-category-badge" id="viewModalBadge" style="background:rgba(139,92,246,0.12);color:#8B5CF6;">User</span>
                    <h2 id="viewModalTitle">User Details</h2>
                </div>
                <button class="modal-close-futuristic" onclick="closeModal('viewModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-futuristic" id="viewModalBody"></div>
            <div class="modal-footer-futuristic">
                <button class="btn-modal-cancel" onclick="closeModal('viewModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal modal-futuristic">
            <div class="modal-header-futuristic">
                <div class="modal-header-content">
                    <span class="modal-category-badge" style="background:rgba(239,68,68,0.15);color:#ef4444;"><i class="fas fa-exclamation-triangle"></i> Warning</span>
                    <h2>Confirm Delete</h2>
                </div>
                <button class="modal-close-futuristic" onclick="closeModal('deleteModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-futuristic" style="text-align:center;padding:40px 24px;">
                <i class="fas fa-trash" style="font-size:3rem;color:#ef4444;opacity:0.5;margin-bottom:16px;"></i>
                <p style="font-size:1.1rem;color:#11141A;">Are you sure you want to delete this user?</p>
                <p style="color:#88909C;font-size:0.9rem;">This action cannot be undone.</p>
            </div>
            <div class="modal-footer-futuristic">
                <button class="btn-modal-cancel" onclick="closeModal('deleteModal')">Cancel</button>
                <button class="btn-modal-confirm-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvE1_9PpviXzJZJZ0Z6GnAcDJ5AFljAcE",
            authDomain: "v-rent-9048c.firebaseapp.com",
            projectId: "v-rent-9048c",
            storageBucket: "v-rent-9048c.firebasestorage.app",
            messagingSenderId: "1005234060424",
            appId: "1:1005234060424:web:34d0207a3589a70ff7333d",
            measurementId: "G-P827PD43LS"
        };
        firebase.initializeApp(firebaseConfig);
        window.auth = firebase.auth();
        window.db = firebase.firestore();
    </script>

    <script src="AdminPanel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AdminPanel.initUsers();
        });
    </script>

</body>
</html>
