<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Notifications</title>
    <link rel="stylesheet" href="AdminPanel.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <!-- ============================================================ -->
    <!-- SIDEBAR                                                        -->
    <!-- ============================================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="vrent-logo.jpeg" alt="V-Rent Logo" class="sidebar-logo" />
            <span>V-Rent Admin</span>
        </div>

        <nav class="sidebar-nav">
            <!-- OVERVIEW -->
            <a href="admin-dashboard.html">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>

            <!-- ACTION REQUIRED -->
            <a href="admin-notifications.html" class="active">
                <i class="fas fa-bell"></i> Notifications
                <span class="nav-badge" id="navNotifBadge" style="display:none;">0</span>
            </a>
            <a href="admin-verifications.html">
                <i class="fas fa-id-card"></i> Verifications
                <span class="nav-badge" id="navVerifBadge" style="display:none;">0</span>
            </a>
            <a href="admin-vehicles.html">
                <i class="fas fa-car"></i> Vehicles
                <span class="nav-badge" id="navVehicleBadge" style="display:none;">0</span>
            </a>

            <!-- MANAGE DATA -->
            <a href="admin-bookings.html">
                <i class="fas fa-calendar-check"></i> Bookings
            </a>
            <a href="admin-users.html">
                <i class="fas fa-users"></i> Users
            </a>
            <a href="admin-delivery-rates.html">
                <i class="fas fa-truck"></i> Delivery Rates
            </a>

            <!-- FEEDBACK -->
            <a href="admin-reviews.html">
                <i class="fas fa-star"></i> Reviews
            </a>
        </nav>

        <div class="sidebar-footer">
            <button id="adminLogoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ============================================================ -->
    <!-- MAIN CONTENT                                                  -->
    <!-- ============================================================ -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Notifications</h1>
            </div>
        </header>

        <div class="admin-content">

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card" style="--accent:#D4AF37;">
                    <div class="stat-icon"><i class="fas fa-key"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="pickupCount">0</span>
                        <span class="stat-label">Pickup Confirmed</span>
                    </div>
                </div>
                <div class="stat-card" style="--accent:#10B981;">
                    <div class="stat-icon"><i class="fas fa-undo-alt"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="returnCount">0</span>
                        <span class="stat-label">Return Confirmed</span>
                    </div>
                </div>
                <div class="stat-card" style="--accent:#F59E0B;">
                    <div class="stat-icon"><i class="fas fa-envelope"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="unreadCount">0</span>
                        <span class="stat-label">Unread</span>
                    </div>
                </div>
                <div class="stat-card" style="--accent:#3B82F6;">
                    <div class="stat-icon"><i class="fas fa-list"></i></div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalCount">0</span>
                        <span class="stat-label">Total Alerts</span>
                    </div>
                </div>
            </div>

            <!-- Filter tabs -->
            <div class="admin-tabs">
                <button class="tab-btn active" data-filter="all">
                    <i class="fas fa-list"></i> All
                </button>
                <button class="tab-btn" data-filter="pickup">
                    <i class="fas fa-key"></i> Pickups
                </button>
                <button class="tab-btn" data-filter="return">
                    <i class="fas fa-undo-alt"></i> Returns
                </button>
                <button class="tab-btn" data-filter="unread">
                    <i class="fas fa-envelope"></i> Unread
                </button>
            </div>

            <!-- Notification list -->
            <div class="table-container">
                <div class="table-header">
                    <h3 id="notifTableTitle">
                        <i class="fas fa-bell" style="color:#D4AF37;"></i> All Notifications
                    </h3>
                    <span class="table-count" id="notifTableCount">0 items</span>
                </div>
                <div id="notificationList">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading notifications...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ============================================================ -->
    <!-- FIREBASE SDK                                                  -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>

            apiKey: "AIzaSyDvE1_9PpviXzJZJZ0Z6GnAcDJ5AFljAcE",
            authDomain: "v-rent-9048c.firebaseapp.com",
            projectId: "v-rent-9048c",
            storageBucket: "v-rent-9048c.firebasestorage.app",
            messagingSenderId: "1005234060424",
            appId: "1:1005234060424:web:34d0207a3589a70ff7333d",

        };
        firebase.initializeApp(firebaseConfig);
        window.auth = firebase.auth();
        window.db = firebase.firestore();
    </script>

    <!-- AdminPanel.js handles: auth, sidebar, notifications listener, badges -->
    <script src="AdminPanel.js"></script>

</body>
</html>
